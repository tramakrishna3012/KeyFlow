version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: look_system_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      # Default: SQLite on the persistent `look_db_data` volume below (survives container
      # restarts/rebuilds as long as the volume isn't removed). To use real Postgres (e.g. a
      # free Supabase project) instead, set DATABASE_URL in your shell/.env before `docker
      # compose up` — see backend/.env.example — and DB_PATH below is simply unused.
      - DB_PATH=/app/data/look_system.db
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      - look_db_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: look_system_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  look_db_data:
