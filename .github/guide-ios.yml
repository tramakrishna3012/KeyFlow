appId: com.keyflow.keyflowApp
---
- launchApp
- assertVisible: "Continue in Offline Mode"
- tapOn: "Continue in Offline Mode"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    point: "30%,94%"
- tapOn: "Save Snippet"
- inputText: "KeyFlow sample for the demo"
- runFlow:
    when:
      visible: "^Continue$"
    commands:
      - tapOn: "^Continue$"
- takeScreenshot: ios-01-typed
- tapOn: "^Save$"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    point: "89%,36%"
- takeScreenshot: ios-02-copy-result
- tapOn: "Save Snippet"
- longPressOn:
    point: "25%,31%"
- takeScreenshot: ios-03-clipboard-menu
- tapOn:
    text: "Paste"
    optional: true
- takeScreenshot: ios-04-paste-result
- runFlow:
    when:
      notVisible: "KeyFlow sample for the demo"
    commands:
      - inputText: "KeyFlow sync test"
- tapOn: "Save & Sync"
- takeScreenshot: ios-05-sync-result
