name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f59149128a37095408e7c1152a6442624cde3fb8 # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Analyze code
      run: |
        cd app
        flutter analyze
        
    - name: Run unit and database tests
      continue-on-error: true
      run: |
        cd app
        flutter test test/encrypted_db_test.dart \
          test/capture_service_test.dart \
          test/look_monitor_test.dart \
          --coverage \
          --timeout=120s || true
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@0565863a31f2c77d6bf9dd1544455b27337a32b6 # v4.6.0
      with:
        directory: app/coverage/
        fail_ci_if_error: false
        
    - name: Check formatting
      run: |
        cd app
        dart format --set-exit-if-changed .
        
  build-android:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f59149128a37095408e7c1152a6442624cde3fb8 # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Set up Java 17
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Build Android APK
      run: |
        cd app
        flutter build apk --release
        
    - name: Upload Android APK artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: android-apk
        path: app/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
        
  build-web:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f59149128a37095408e7c1152a6442624cde3fb8 # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Build Web
      run: |
        cd app
        flutter build web --release
        
    - name: Upload Web build artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: web-build
        path: app/build/web/
        retention-days: 7