name: Build macOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/macos/**'
      - 'app/pubspec.yaml'
      - '.github/workflows/build-macos.yml'

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get --enforce-lockfile
        
    - name: Build macOS Application
      run: |
        cd app
        flutter build macos --release
        
    - name: Package macOS Universal Zip
      run: |
        cd app/build/macos/Build/Products/Release
        zip -r KeyFlow-macOS-Universal.zip *.app
        
    - name: Upload macOS build artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: KeyFlow-macOS-Universal
        path: app/build/macos/Build/Products/Release/KeyFlow-macOS-Universal.zip
        retention-days: 30
        
    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
      with:
        files: app/build/macos/Build/Products/Release/KeyFlow-macOS-Universal.zip
