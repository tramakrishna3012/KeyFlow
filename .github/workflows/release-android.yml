name: Release Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Tag / Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'
  release:
    types: [created, published]

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Setup Java
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Configure Keystore Signing (if secret provided)
      env:
        ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ -n "$ANDROID_KEYSTORE" ]; then
          echo "$ANDROID_KEYSTORE" | base64 --decode > app/android/android_keystore.jks
          cat > app/android/key.properties <<EOF
        storePassword=$ANDROID_KEYSTORE_PASSWORD
        keyPassword=$ANDROID_KEY_PASSWORD
        keyAlias=$ANDROID_KEY_ALIAS
        storeFile=android_keystore.jks
        EOF
          echo "Release keystore configured successfully."
        else
          echo "No ANDROID_KEYSTORE secret found. Falling back to debug signing."
        fi
        
    - name: Build Android App Bundle
      run: |
        cd app
        flutter build appbundle --release --no-tree-shake-icons
        
    - name: Build Android APK
      run: |
        cd app
        flutter build apk --release --split-per-abi --no-tree-shake-icons
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: android-app-bundle
        path: app/build/app/outputs/bundle/release/app-release.aab
        retention-days: 30
        
    - name: Upload APK artifacts
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: android-apks
        path: app/build/app/outputs/flutter-apk/*.apk
        retention-days: 30
        
    - name: Upload to GitHub Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
      with:
        files: |
          app/build/app/outputs/bundle/release/app-release.aab
          app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          app/build/app/outputs/flutter-apk/app-x86_64-release.apk