name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/windows/**'
      - 'app/pubspec.yaml'

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Build Windows executable
      run: |
        cd app
        flutter build windows --release
        
    - name: Create Windows installer package
      run: |
        cd app/build/windows/runner/Release
        Compress-Archive -Path * -DestinationPath KeyFlow-Windows.zip -Force
        
    - name: Upload Windows build artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: app/build/windows/runner/Release/KeyFlow-Windows.zip
        retention-days: 30
        
    - name: Upload to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/windows/runner/Release/KeyFlow-Windows.zip