name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Debug Keystore (CI fallback)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build Release APK via Gradle
        run: |
          # Bypass Flutter CLI's file-watcher bug ("Already watching path") by
          # invoking Gradle directly. The Flutter Gradle plugin handles Dart AOT
          # compilation, asset bundling, and APK packaging — `flutter build apk`
          # is just a thin wrapper that adds a broken file-watcher on top.
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Determine Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare APK Asset
        run: |
          # Find the release APK — Gradle may place it in different paths
          APK=$(find build android/app/build -name "app-release.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found. Listing build outputs for debugging:"
            find build android/app/build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          echo "Found APK at: $APK"
          cp "$APK" "${{ github.workspace }}/KeyFlow.apk"

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: KeyFlow.apk
          name: KeyFlow ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
