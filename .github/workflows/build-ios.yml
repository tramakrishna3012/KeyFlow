name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/ios/**'
      - 'app/pubspec.yaml'

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get --enforce-lockfile
        
    - name: Build iOS App Bundle
      run: |
        cd app
        flutter build ios --release --no-codesign
        
    - name: Package .ipa Payload
      run: |
        cd app
        mkdir -p build/ios/ipa/Payload
        cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
        cd build/ios/ipa
        zip -r KeyFlow.ipa Payload
        
    - name: Upload KeyFlow .ipa artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: KeyFlow-iOS-ipa
        path: app/build/ios/ipa/KeyFlow.ipa
        retention-days: 30

        
  test-ios:
    runs-on: macos-latest
    needs: build-ios
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get --enforce-lockfile
        
    - name: Run iOS tests
      run: |
        cd app
        flutter test --coverage