name: Build iOS

on: workflow_dispatch

jobs:
  capture-keyflow-screen:
    runs-on: macos-26
    permissions:
      actions: read
    steps:
      - name: Download the verified simulator package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: KeyFlow-iOS-Simulator
          run-id: 43591951613
          github-token: ${{ github.token }}
          path: app-artifact
      - name: Launch KeyFlow and capture the simulator screen
        run: |
          mkdir guide-screens
          ditto -x -k app-artifact/KeyFlow-Simulator.zip app-artifact
          app=app-artifact/Runner.app
          device=$(xcrun simctl list devices available -j | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$device" || true
          for attempt in {1..24}; do
            if xcrun simctl spawn "$device" launchctl print system >/dev/null 2>&1 && xcrun simctl install "$device" "$app"; then
              break
            fi
            sleep 5
          done
          xcrun simctl install "$device" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$device" "$bundle"
          sleep 12
          xcrun simctl io "$device" screenshot guide-screens/ios-keyflow.png
      - name: Upload original simulator screenshot
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: KeyFlow-iPhone-Guide-Screenshot
          path: guide-screens/
          if-no-files-found: error
