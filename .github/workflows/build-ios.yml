name: Build iOS
on: workflow_dispatch
jobs:
  ios-guide:
    runs-on: macos-26
    timeout-minutes: 26
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the guide test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare the iPhone simulator and test runner
        run: |
          mkdir -p ios-images tools
          device=$(xcrun simctl list devices available -j | jq -er '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          printf 'GUIDE_DEVICE=%s\n' "$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device" || true
          curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 90 --fail --silent --show-error --location https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip --output tools/maestro.zip
          curl --retry 5 --retry-all-errors --connect-timeout 15 --max-time 90 --fail --silent --show-error --location https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/checksums_sha256.txt --output tools/checksums_sha256.txt
          cd tools
          shasum -a 256 --ignore-missing -c checksums_sha256.txt
          unzip -q maestro.zip
          echo "MAESTRO_CLI=$(find "$PWD" -type f -path '*/bin/maestro' | head -n 1)" >> "$GITHUB_ENV"
      - name: Await the combined simulator artifact
        run: |
          for attempt in {1..135}; do
            if gh run download 44153745353 --name KeyFlow-iOS-Simulator --dir app-artifact 2>/dev/null; then
              break
            fi
            sleep 8
          done
          ditto -x -k app-artifact/KeyFlow-Simulator.zip app-artifact
          xcrun simctl bootstatus "$GUIDE_DEVICE" -b
          xcrun simctl install "$GUIDE_DEVICE" app-artifact/Runner.app
      - name: Run the iPhone customer journey
        run: |
          export MAESTRO_CLI_NO_ANALYTICS=1
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home -v 17)
          "$MAESTRO_CLI" --device "$GUIDE_DEVICE" test .github/guide-ios.yml --test-output-dir ios-images
      - name: Run the iPhone Share extension journey
        if: always()
        run: |
          fixture=QAKeyFlowShareHost.app
          mkdir -p "$fixture"
          cat > "$fixture/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>KeyFlow Share Test</string>
            <key>CFBundleIdentifier</key><string>com.keyflow.QAShareFixture</string>
            <key>CFBundleExecutable</key><string>QAKeyFlowShareHost</string>
            <key>CFBundleName</key><string>QAKeyFlowShareHost</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>UILaunchScreen</key><dict/>
          </dict></plist>
          PLIST
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target "$(uname -m)-apple-ios17.0-simulator" -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" .github/QAKeyFlowShareHost.swift -o "$fixture/QAKeyFlowShareHost"
          xcrun simctl install "$GUIDE_DEVICE" "$fixture"
          export MAESTRO_CLI_NO_ANALYTICS=1
          export JAVA_HOME=$(/usr/libexec/java_home -v 21 2>/dev/null || /usr/libexec/java_home -v 17)
          "$MAESTRO_CLI" --device "$GUIDE_DEVICE" test .github/guide-share.yml --test-output-dir ios-images
      - name: Collect original iPhone screenshots
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: KeyFlow-iPhone-User-Journey
          path: |
            ios-images/**/*.png
            .maestro/**/*.png
            .github/ios-*.png
            ios-*.png
          include-hidden-files: true
          if-no-files-found: warn

