name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/ios/**'
      - 'app/pubspec.yaml'

env:
  FLUTTER_VERSION: '3.44.7'

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f59149128a37095408e7c1152a6442624cde3fb8 # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Build iOS
      run: |
        cd app
        flutter build ios --release --no-codesign
        
    - name: Upload iOS build artifact
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
      with:
        name: ios-build
        path: app/build/ios/iphoneos/
        retention-days: 30
        
  test-ios:
    runs-on: macos-latest
    needs: build-ios
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Flutter
      uses: subosito/flutter-action@f59149128a37095408e7c1152a6442624cde3fb8 # v2.18.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        cache-key: flutter-${{ env.FLUTTER_VERSION }}
        cache-path: ${{ github.workspace }}/.pub-cache
        
    - name: Get Flutter dependencies
      run: |
        cd app
        flutter pub get
        
    - name: Run iOS tests
      run: |
        cd app
        flutter test --coverage