name: Build iOS IPA & Artifacts

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build_ios.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/build_ios.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS IPA Bundle
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Bundle (Unsigned IPA)
        run: flutter build ios --no-codesign --release

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r KeyFlow-iOS-Unsigned.ipa Payload
          mv KeyFlow-iOS-Unsigned.ipa build/ios/iphoneos/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyFlow-iOS-Unsigned.ipa
          path: app/build/ios/iphoneos/KeyFlow-iOS-Unsigned.ipa
          retention-days: 30
