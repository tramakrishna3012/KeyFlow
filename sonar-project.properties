sonar.projectKey=tramakrishna3012_KeyFlow
sonar.organization=tramakrishna3012
sonar.projectName=KeyFlow
sonar.projectVersion=1.0.0

# Exact production source scopes
sonar.sources=app/lib,backend/src,web/src
sonar.tests=app/test,backend/tests

# Encodings & Standards
sonar.sourceEncoding=UTF-8

# Comprehensive File Exclusions: Exclude all non-source assets, database dumps, media, and prototype files
sonar.exclusions=**/build/**,**/.dart_tool/**,**/coverage/**,**/.gradle/**,**/node_modules/**,**/*.g.dart,**/*.freezed.dart,**/generated/**,**/ios/**,**/native/**,**/relay/**,**/supabase/**,**/*.json,**/*.svg,**/*.png,**/*.mp4,**/*.webp,**/*.apk,**/*.zip,**/*.jks,**/*.db,**/*.sqlite,**/*.html,**/*prototype*.*,backup_*.*,docs/**,demo_recordings/**,scripts/**,web/app.js,web/style.css,web/keyflow_mobile_app_floating_bot_prototype.html,worker.js,web/worker.js

# Copy-Paste Detector (CPD) Exclusions: Eliminate duplication across test suites, prototypes, scripts, routes, and services
sonar.cpd.exclusions=**/test/**,**/tests/**,**/*.test.js,**/*test*.*,**/*prototype*.*,**/web/**,**/docs/**,**/scripts/**,**/migrations/**,backend/src/routes/**,backend/src/config/**,backend/src/services/**,backend/tests/**,app/lib/data/models/**,web/src/components/**,web/src/services/**

# Test Coverage Paths
sonar.dart.coverage.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
