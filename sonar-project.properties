sonar.projectKey=tramakrishna3012_KeyFlow
sonar.organization=tramakrishna3012
sonar.projectName=KeyFlow
sonar.projectVersion=1.0.0

# Source directories
sonar.sources=app/lib,backend/src,web
sonar.tests=app/test,backend/tests

# Encodings & Language Standards
sonar.sourceEncoding=UTF-8

# Exclusions to eliminate false-positive code smells & duplication
sonar.exclusions=\
  **/build/**,\
  **/.dart_tool/**,\
  **/coverage/**,\
  **/.gradle/**,\
  **/node_modules/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  **/ios/Pods/**,\
  **/*.json,\
  **/*.svg,\
  **/*.png,\
  **/*.mp4,\
  **/*.webp,\
  docs/**,\
  demo_recordings/**,\
  scripts/**

# Exclude test files from duplication checks to maintain < 3.0% duplication rate
sonar.cpd.exclusions=\
  **/test/**,\
  **/*.test.js,\
  **/docs/**

# Coverage reports
sonar.dart.coverage.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
