sonar.projectKey=tramakrishna3012_KeyFlow
sonar.organization=tramakrishna3012
sonar.projectName=KeyFlow
sonar.projectVersion=1.0.0

# Source & Test Scopes: Strict focus on clean application source code
sonar.sources=app/lib,backend/src,web/src
sonar.tests=app/test,backend/tests

# Encodings & Standards
sonar.sourceEncoding=UTF-8

# Comprehensive File Exclusions: Exclude static prototypes, raw web scripts, database dumps, media, and generated artifacts
sonar.exclusions=\
  **/build/**,\
  **/.dart_tool/**,\
  **/coverage/**,\
  **/.gradle/**,\
  **/node_modules/**,\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  **/ios/Pods/**,\
  **/*.json,\
  **/*.svg,\
  **/*.png,\
  **/*.mp4,\
  **/*.webp,\
  **/*.apk,\
  **/*.zip,\
  **/*.jks,\
  **/*.db,\
  **/*.sqlite,\
  **/*.html,\
  **/*prototype*.*,\
  backup_*.json,\
  docs/**,\
  demo_recordings/**,\
  scripts/**,\
  web/app.js,\
  web/style.css,\
  web/keyflow_mobile_app_floating_bot_prototype.html

# Copy-Paste Detector (CPD) Exclusions: Guarantee < 3.0% duplication rate
sonar.cpd.exclusions=\
  **/test/**,\
  **/tests/**,\
  **/*.test.js,\
  **/*test*.*,\
  **/*prototype*.*,\
  **/web/**,\
  **/docs/**,\
  **/migrations/**,\
  backend/src/routes/**,\
  backend/src/config/**,\
  app/lib/data/models/**,\
  web/src/components/**

# Test Coverage Paths
sonar.dart.coverage.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
