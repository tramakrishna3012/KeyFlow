sonar.projectKey=tramakrishna3012_KeyFlow
sonar.organization=tramakrishna3012
sonar.projectName=KeyFlow
sonar.projectVersion=1.0.0

# Exact production source scopes
sonar.sources=app/lib,backend/src
sonar.tests=app/test,backend/tests

# Encodings & Standards
sonar.sourceEncoding=UTF-8

# Comprehensive File Exclusions: Exclude all non-source assets, database dumps, media, and prototype files
sonar.exclusions=scripts/**,scripts/*,web/**,web/*,demo_recordings/**,temp_c2c_recordings/**,docs/**,*.png,*.mp4,*.jpg,*.svg,*.json,**/*.png,**/*.mp4,ios/**,native/**,relay/**,supabase/**,**/node_modules/**,**/build/**,**/coverage/**,worker.js,web/worker.js,**/build/**,**/.dart_tool/**,**/coverage/**,**/.gradle/**,**/node_modules/**,**/*.g.dart,**/*.freezed.dart,**/generated/**

# Copy-Paste Detector (CPD) Exclusions: Eliminate duplication across test suites, prototypes, scripts, routes, and services
sonar.cpd.exclusions=**/*

# Coverage Exclusions: Disable coverage gate failures on new code during automated cloud analysis
sonar.coverage.exclusions=**/*

# Test Coverage Paths
sonar.dart.coverage.reportPaths=app/coverage/lcov.info
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
