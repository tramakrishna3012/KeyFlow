name: keyflow_app
description: "KeyFlow — Local-first typing history & assist app"
publish_to: 'none'
version: 0.1.5+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.5.1
  http: ^1.2.0
  permission_handler: ^11.3.0
  supabase_flutter: ^2.8.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  pointycastle: ^3.9.1
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/icon/logo.png"
  adaptive_icon_background: "#2D1B69"
  web:
    generate: true
    image_path: "assets/icon/logo.png"
  windows:
    generate: true
    image_path: "assets/icon/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/logo.png"
