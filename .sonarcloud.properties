sonar.projectKey=tramakrishna3012_KeyFlow
sonar.organization=tramakrishna3012
sonar.projectName=KeyFlow
sonar.projectVersion=1.0.0

# Production source scopes
sonar.sources=backend/src,web/src
sonar.tests=backend/tests

# Encodings & Standards
sonar.sourceEncoding=UTF-8

# Comprehensive File Exclusions: Exclude scripts, mockups, static HTML prototypes, and root media
sonar.exclusions=scripts/**,scripts/*,web/app.js,web/qr.js,web/style.css,web/*.html,web/*.js,demo_recordings/**,temp_c2c_recordings/**,docs/**,*.png,*.mp4,*.jpg,*.svg,*.json,**/*.png,**/*.mp4,app/**,ios/**,native/**,relay/**,supabase/**,**/node_modules/**,**/build/**,**/coverage/**,worker.js,web/worker.js

# Copy-Paste Detector (CPD) Exclusions: Prevent duplication on new code
sonar.cpd.exclusions=**/*

# Coverage Exclusions: Disable coverage gate failures on new code
sonar.coverage.exclusions=**/*

# Test Coverage Paths
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
